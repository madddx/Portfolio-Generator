<style>/* Shared UI for the generator and the admin page */
:root { --bg: #f4f5f7; --panel: #fff; --panel-2: #fafbfc; --line: #e2e5ea; --text: #161a22; --muted: #667085; --accent: #2f4bff; --accent-ink: #fff; --accent-soft: #eaedff; --danger: #c8321f; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18); }
@media (prefers-color-scheme: dark) { :root { --bg: #0d0f13; --panel: #161920; --panel-2: #12151b; --line: #262b36; --text: #e9ecf3; --muted: #8d95a8; --accent: #7b8cff; --accent-ink: #0a0c1c; --accent-soft: #1f2447; --danger: #ff7b6b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .55rem .95rem; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-weight: 600; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: .35rem .7rem; font-size: 13px; }
.btn.lg { padding: .8rem 1.4rem; font-size: 15px; }
.btn.add { width: 100%; border-style: dashed; background: transparent; color: var(--muted); }
.btn.add:hover { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0 0 0 .6rem; }
.icon { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
.icon:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.icon:disabled { opacity: .3; cursor: default; }

/* shell */
.app { display: grid; grid-template-rows: 56px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.topbar { display: flex; align-items: center; gap: .75rem; padding: 0 1rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.brand i { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: inline-block; box-shadow: 5px 5px 0 -1px var(--accent-soft); }
.top-spacer { flex: 1; }
.status { color: var(--muted); font-size: 13px; }
.status.warn { color: var(--danger); font-weight: 600; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 220px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: grid; }
.menu-pop button { text-align: left; padding: .55rem .7rem; border: 0; background: none; border-radius: 6px; }
.menu-pop button:hover { background: var(--accent-soft); }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 46%); min-height: 0; }
.preview-toggle { display: none; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: .6rem 1rem; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.banner span { flex: 1; }

/* editor */
.ed { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 0; position: relative; border-right: 1px solid var(--line); background: var(--panel-2); }
.ed-nav { overflow-y: auto; padding: 12px 8px 24px; border-right: 1px solid var(--line); background: var(--panel); }
.ed-group { margin: 14px 10px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.ed-group:first-child { margin-top: 2px; }
.ed-link { display: flex; align-items: center; justify-content: space-between; gap: .5rem; width: 100%; padding: .45rem .7rem; border: 0; border-radius: 8px; background: none; text-align: left; }
.ed-link:hover { background: var(--bg); }
.ed-link.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ed-count { min-width: 1.4em; text-align: center; font-size: 12px; color: var(--muted); }
.ed-link.on .ed-count { color: var(--accent); }
.ed-main { overflow-y: auto; padding: 24px 28px 48px; min-width: 0; }
.ed-head h2 { margin: 0 0 .25rem; font-size: 20px; letter-spacing: -.01em; }
.ed-head p { margin: 0 0 1.25rem; color: var(--muted); max-width: 60ch; }
.ed-body { display: grid; gap: 1.25rem; }
.ed-foot { display: flex; justify-content: space-between; margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
.ed-toast { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 40; padding: .6rem .9rem; border-radius: 10px; background: var(--text); color: var(--bg); box-shadow: var(--shadow); transition: opacity .2s, transform .2s; max-width: 90%; }
.ed-toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.ed-toast .link { color: var(--bg); text-decoration: underline; }
.intro { margin: 0 0 1.25rem; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: center; }
.intro p { margin: 0; flex: 1 1 260px; color: var(--muted); }

/* form */
.grp { padding: 1.1rem 1.2rem 1.25rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 1rem; }
.grp h3 { margin: 0; font-size: 15px; }
.grp-h { margin: -.6rem 0 0; color: var(--muted); }
.grid { display: grid; gap: 1rem; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 90px minmax(0, 1.4fr) minmax(0, 1fr); }
.f { display: grid; gap: .3rem; align-content: start; min-width: 0; }
.f-l { font-weight: 600; font-size: 13px; }
.f-h { color: var(--muted); font-size: 12.5px; }
input[type=text], input[type=email], input[type=url], textarea { width: 100%; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
input[type=text]:hover, textarea:hover, input[type=email]:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
textarea { resize: vertical; line-height: 1.5; }
.check { display: flex; gap: .7rem; align-items: flex-start; cursor: pointer; }
.check input { margin-top: .2rem; width: 16px; height: 16px; accent-color: var(--accent); }
.check span { display: grid; } .check small { color: var(--muted); font-size: 12.5px; }
.rows { display: grid; gap: .5rem; }
.row-item { display: flex; gap: .5rem; align-items: center; } .row-item input { min-width: 0; }
.rows > .btn { justify-self: start; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; }

/* image field */
.img-field { display: grid; gap: .6rem; padding: .7rem; border: 1px dashed var(--line); border-radius: 10px; }
.img-field.drop { border-color: var(--accent); background: var(--accent-soft); }
.img-top { display: flex; gap: .9rem; align-items: center; }
.img-thumb { flex: none; width: 72px; height: 72px; border-radius: 8px; background: var(--bg) center / cover no-repeat; border: 1px solid var(--line); }
.img-thumb:not(.has)::after { content: ''; display: block; height: 100%; background: linear-gradient(135deg, transparent 48%, var(--line) 49% 51%, transparent 52%); }
.img-btns { display: grid; gap: .4rem; } .img-meta { color: var(--muted); font-size: 12.5px; }

/* cards in lists */
.list { display: grid; gap: .6rem; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.it-head { display: flex; align-items: center; gap: .6rem; padding: .55rem .6rem .55rem .9rem; cursor: pointer; user-select: none; }
.it-head:hover { background: var(--panel-2); }
.it-chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.item.open .it-chev { transform: rotate(45deg); }
.it-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it-title.is-empty { color: var(--muted); font-weight: 500; font-style: italic; }
.it-actions { display: flex; gap: 2px; }
.it-body { display: none; padding: .4rem 1rem 1.1rem; border-top: 1px solid var(--line); gap: 1rem; }
.item.open .it-body { display: grid; padding-top: 1rem; }
.empty { padding: 2rem 1rem; text-align: center; border: 1px dashed var(--line); border-radius: 12px; display: grid; gap: .8rem; justify-items: center; color: var(--muted); }
.empty p { margin: 0; }

/* design panel */
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .8rem; }
.style { display: grid; gap: .35rem; align-content: start; padding: .6rem .6rem .8rem; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; }
.style:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.style.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.style-art svg { display: block; width: 100%; height: auto; border-radius: 7px; border: 1px solid var(--line); }
.style-name { font-weight: 700; margin-top: .3rem; } .style-blurb { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.seg { display: inline-flex; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.seg button { padding: .4rem .9rem; border: 0; border-radius: 7px; background: none; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.sp { height: .2rem; }
.accent-row { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem; }
.accent-row input[type=color] { width: 42px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.swatches { display: flex; gap: .4rem; flex-wrap: wrap; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.sw.on { box-shadow: 0 0 0 2px var(--accent); }
.secs { display: grid; gap: .4rem; }
.sec-row { display: flex; align-items: center; gap: .6rem; padding: .35rem .5rem .35rem .7rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.sec-row.off { opacity: .55; } .sec-row input[type=text] { flex: 1; min-width: 0; border-color: transparent; background: transparent; font-weight: 600; }
.sec-row input[type=text]:focus, .sec-row input[type=text]:hover { border-color: var(--line); background: var(--panel); }
.sec-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.pill.new { margin-left: .5rem; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.pill { font-size: 12px; color: var(--muted); background: var(--bg); padding: .1rem .5rem; border-radius: 99px; white-space: nowrap; }

/* download / publish panel */
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: .9rem; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: .7rem; counter-increment: s; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.steps b { display: block; } .steps span { color: var(--muted); }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: .4rem; }
.checks li { display: flex; gap: .6rem; align-items: baseline; } .checks li::before { content: '○'; color: var(--muted); } .checks li.ok::before { content: '✓'; color: #19a45b; font-weight: 700; } .checks li.warn::before { content: '!'; color: var(--danger); font-weight: 700; }
code, kbd { font: 12.5px ui-monospace, Menlo, monospace; background: var(--bg); padding: .1rem .35rem; border-radius: 5px; }

/* preview */
.preview.bare { grid-template-rows: minmax(0, 1fr); }
.preview { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--bg); }
.pv-bar { display: flex; align-items: center; gap: .6rem; padding: .6rem .9rem; border-bottom: 1px solid var(--line); }
.pv-bar .seg button { padding: .25rem .7rem; font-size: 13px; }
.pv-stage { position: relative; overflow: hidden; min-height: 0; }
.pv-frame { position: absolute; left: 0; top: 0; border: 0; background: #fff; transform-origin: 0 0; box-shadow: var(--shadow); }
.pv-frame.phone { border-radius: 28px; border: 8px solid #1b1d24; }

/* narrow screens */
@media (max-width: 1100px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .preview:not(.bare) { display: none; position: fixed; inset: 56px 0 0 0; z-index: 20; }
  .show-preview .preview:not(.bare) { display: grid; }
  .preview-toggle { display: inline-flex; }
}
@media (max-width: 760px) {
  .ed { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .ed-nav { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .ed-group { display: none; } .ed-link { width: auto; flex: none; } .ed-main { padding: 18px 16px 40px; }
  .g2, .g3 { grid-template-columns: 1fr; } .hide-sm { display: none; } .topbar { gap: .4rem; padding: 0 .6rem; }
}
.intro .hint{margin:14px 0 6px;color:var(--muted,#667);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html" title="Back to the start" style="text-decoration:none;color:inherit"><i aria-hidden="true"></i>Generate It!</a>
    <details class="menu" id="menu">
      <summary class="btn sm ghost">Project ▾</summary>
      <div class="menu-pop">
        <button type="button" id="m-sample">Fill with sample content</button>
        <button type="button" id="m-import">Open my site (.zip) or project…</button>
        <button type="button" id="m-backup">Save project file</button>
        <button type="button" id="m-reset">Start over</button>
      </div>
    </details>
    <input type="file" id="import-file" accept=".zip,.js,.json,application/zip,application/json,text/javascript" hidden>
    <span class="top-spacer"></span>
    <span class="status hide-sm" id="status" role="status"></span>
    <button type="button" class="btn sm preview-toggle" id="pv-toggle">Preview</button>
    <button type="button" class="btn primary" id="go-download">Download site</button>
  </header>
  <div class="workspace">
    <div id="editor" style="display:contents"></div>
    <div id="preview" style="display:contents"></div>
  </div>
</div>

rticle>';\n      }).join('') + '\u003c/div>';\n    },\n    skills: function (d) {\n      return '\u003cdiv class=\"skill-groups\">' + items(d, 'skills').map(function (g) {\n        return '\u003cdiv class=\"skill-group\">' + (has(g.category) ? '\u003ch3>' + esc(g.category) + '\u003c/h3>' : '') +\n          '\u003cul class=\"chips\">' + list(g.items).filter(has).map(function (n) {\n            var ic = PF.skillIcon(n);\n            return '\u003cli class=\"chip chip--skill\">' + (ic ? '\u003ci class=\"' + ic + '\" aria-hidden=\"true\">\u003c/i>' : '') + esc(n) + '\u003c/li>';\n          }).join('') + '\u003c/ul>\u003c/div>';\n      }).join('') + '\u003c/div>';\n    },\n    education: function (d) {\n      return '\u003cdiv class=\"edu-list\">' + items(d, 'education').map(function (e) {\n        var logo = img(e.logo, e.institution);\n        var name = has(e.link) ? link(e.link, 'edu-name', esc(e.institution)) : '\u003cspan class=\"edu-name\">' + esc(e.institution) + '\u003c/span>';\n        return '\u003carticle class=\"edu-item\">' + (logo ? '\u003cdiv class=\"edu-logo\">' + logo + '\u003c/div>' : '') + '\u003cdiv class=\"edu-info\">\u003ch3>' + name + '\u003c/h3>' +\n          (has(e.degree) ? '\u003cp class=\"edu-degree\">' + esc(e.degree) + '\u003c/p>' : '') + (has(e.period) ? '\u003cp class=\"edu-period\">' + esc(e.period) + '\u003c/p>' : '') +\n          (list(e.courses).filter(has).length ? '\u003cul class=\"tags\">' + e.courses.filter(has).map(function (c) { return '\u003cli>' + esc(c) + '\u003c/li>'; }).join('') + '\u003c/ul>' : '') +\n          '\u003c/div>\u003c/article>';\n      }).join('') + '\u003c/div>';\n    },\n    certifications: function (d) {\n      return '\u003cdiv class=\"cert-grid\">' + items(d, 'certifications').map(function (c) {\n        var im = img(c.img, c.issuer || c.name);\n        return link(c.link, 'cert-card', (im ? '\u003cspan class=\"cert-logo\">' + im + '\u003c/span>' : '') +\n          '\u003cspan class=\"cert-text\">\u003cstr adline) ? ' — ' + h.headline : ''));\n    document.title = title;\n    var desc = d.meta.description || String(h.bio || '').slice(0, 155);\n    var m = document.querySelector('meta[name=\"description\"]'); if (m) m.setAttribute('content', desc);\n    var fav = document.querySelector('link[rel=\"icon\"]');\n    if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }\n    var bg = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb';\n    var svg = '\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\">\u003crect width=\"64\" height=\"64\" rx=\"14\" fill=\"' + bg + '\"/>\u003ctext x=\"32\" y=\"42\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">' + initials(h.name) + '\u003c/text>\u003c/svg>';\n    fav.href = 'data:image/svg+xml,' + encodeURIComponent(svg);\n  }\n\n  function render(raw) {\n    var d = PF.normalize(raw);\n    var def = styleDef(d.design.style);\n    DATA = d;\n    ensureFonts(def);\n    ensureTheme(def.id, function () {\n      applyAppearance(d);\n      var app = document.getElementById('app'), html = buildPage(d);\n      if (html !== lastHTML) {\n        var y = window.scrollY;\n        app.innerHTML = html; lastHTML = html;\n        if (previewing) window.scrollTo(0, y);\n        startTyping(); watchSections();\n      }\n      fitNav(); setTimeout(fitNav, 350);   // again once the new style's fonts have changed the text widths\n      setMeta(d);\n      document.documentElement.classList.remove('pf-loading');\n    });\n  }\n\n  // Collapse the nav into a menu button when the links can't fit on one line.\n  function fitNav() {\n    var h = document.querySelector('.site-nav'), l = document.getElementById('nav-links');\n    if (!h || !l) return;\n    h.classList.remove('nav-compact');\n    if (window.innerWidth \u003c= 960 || l.scrollWidth > l.clientWidth + 1) h.classList.add('nav-compact');\n  }\n  va   api = window.PFEditor.create({
    root: $('editor'), data: startData, stepper: true, intro: intro,
    extraPanels: [{ id: 'download', label: 'Download', title: 'Download your website', hint: 'Check everything looks right, then download.', render: downloadPanel }],
    onChange: function (d) { preview && preview.update(); saveDraft(d); },
    onPanel: function (id, p) { preview && preview.scrollTo(p.section); }
  });

  preview = window.PFPreview.create({
    root: $('preview'), getData: function () { return api.getData(); },
    srcdoc: function () { return inlineDoc(null); },
    standalone: function () { return inlineDoc(PF.normalize(api.getData())); }
  });

  if (/#update/.test(location.hash)) setTimeout(function () { api.toast('Choose Project → Open my site (.zip) to load the site you made before.'); }, 400);
  if (draft) setStatus('Draft restored from this browser'); else setStatus('Nothing yet. Start with your name.');

  // ── top bar ────────────────────────────────────────────────────────────
  function closeMenu() { $('menu').open = false; }
  $('go-download').addEventListener('click', function () { document.body.classList.remove('show-preview'); api.showPanel('download'); });
  $('pv-toggle').addEventListener('click', function () { var on = document.body.classList.toggle('show-preview'); this.textContent = on ? 'Edit' : 'Preview'; preview.layout(); });
  $('m-sample').addEventListener('click', function () { closeMenu(); replaceAll(window.PF_SAMPLE(), 'Sample content loaded.'); });
  $('m-reset').addEventListener('click', function () { closeMenu(); replaceAll(PF.emptyData(), 'Started over.'); });
  $('m-backup').addEventListener('click', function () { closeMenu(); saveBlob(new Blob([PF.serializeDataFile(api.getData())], { type: 'text/javascript' }), slug(api.getData().hero.name) + '-project.js'); });
  $('m-import').addEventListener('click', function () { closeMenu(); $('import-file').click(); });
  $('import-file').addEventListener('change', function () {
    var f = this.files[0], input = this; if (!f) return;
    var isZip = /\.zip$/i.test(f.name);
    (isZip ? readSiteZip(f) : f.text()).then(function (t) {
      var d = PF.parseDataFile(t); replaceAll(d, isZip ? 'Your site is loaded. Pick a new style below.' : 'Project opened.');
      if (isZip) { document.body.classList.remove('show-preview'); api.showPanel('design'); }
    }).catch(function () { api.toast(isZip ? 'No portfolio-data.js found in that zip. Use the zip you downloaded from the generator.' : 'That file isn’t a portfolio data file.'); }); input.value = '';
  });
  // A site zip we made earlier: pull portfolio-data.js out of it (wherever the folder is nested).
  function readSiteZip(file) {
    return window.JSZip.loadAsync(file).then(function (z) {
      var hit = Object.keys(z.files).filter(function (n) { return /(^|\/)portfolio-data\.js$/.test(n) && !/__MACOSX/.test(n); }).sort(function (a, b) { return a.length - b.length; })[0];
      if (!hit) throw new Error('no data'); return z.file(hit).async('string');
    });
  }
  document.addEventListener('click', function (e) { var m = $('menu'); if (m.open && !m.contains(e.target)) m.open = false; });
});
</script>
</body>
</html>
