<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Edit your portfolio</title>
<!--@tool.css-->
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><i aria-hidden="true"></i>Edit your portfolio</div>
    <span class="top-spacer"></span>
    <span class="status hide-sm" id="status" role="status"></span>
    <a class="btn sm ghost hide-sm" href="index.html" target="_blank" rel="noopener">View site</a>
    <button type="button" class="btn sm preview-toggle" id="pv-toggle">Preview</button>
    <button type="button" class="btn primary" id="save">Save changes</button>
  </header>
  <div id="banner" hidden></div>
  <div class="workspace">
    <div id="editor" style="display:contents"></div>
    <div id="preview" style="display:contents"></div>
  </div>
</div>
<script src="portfolio-data.js"></script>
<script src="js/schema.js"></script>
<!--@editor.js-->
<!--@preview.js-->

</body>
</html>
